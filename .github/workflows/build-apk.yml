name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CochePDF-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Déposer l'APK sur la branche apk
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/CochePDF.apk
          cd /tmp/out && git init -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add CochePDF.apk && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
